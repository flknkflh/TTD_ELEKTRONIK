# Independent demo stack: start/stop does not recreate the API or database.
name: pqsign-qr-demo
services:
  redirect:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "136.244.116.132:8098:8098"
      - "136.244.116.132:8099:8099"
    volumes:
      - ./Caddyfile.qr-demo:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config
      - /data
    cap_drop: [ALL]
    # Official Caddy binary carries this file capability; retain it so exec
    # succeeds even though this demo only listens on high ports.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
