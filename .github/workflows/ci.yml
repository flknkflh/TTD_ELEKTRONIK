# Pull-request pipeline (Rencana V1 §27).
# format -> unit test Go -> static analysis -> build AAR -> (Android lint: M5)
# -> build server image (M6) -> dependency/secret scan.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: '**/go.sum'

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l core apps server tools 2>/dev/null || true)"
          if [ -n "$fmt_out" ]; then echo "unformatted:"; echo "$fmt_out"; exit 1; fi

      - name: core — vet + test
        working-directory: core
        run: |
          go vet ./...
          go test -race ./...

      - name: windows cli — vet + build
        working-directory: apps/windows
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go build ./...

      - name: server — vet + test
        working-directory: server
        run: |
          go vet ./...
          go test ./...

      - name: ca-admin — vet + test
        working-directory: tools/ca-admin
        run: |
          go vet ./...
          go test ./...

  aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: install NDK r27
        run: sdkmanager --install "ndk;27.1.12297006"
      - name: build pqcsign.aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
        run: sh apps/android/build-aar.sh
      - name: check AAR contents
        run: |
          unzip -l apps/android/app/libs/pqcsign.aar | grep 'jni/arm64-v8a/libgojni.so'
          unzip -p apps/android/app/libs/pqcsign.aar classes.jar > /tmp/c.jar
          unzip -l /tmp/c.jar | grep 'mobilebridge/Mobilebridge.class'

      - name: assemble debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: check APK contents
        run: |
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep 'lib/arm64-v8a/libgojni.so'
          unzip -l "$apk" | grep 'assets/lab/root-ca.crt.pem'
      - uses: actions/upload-artifact@v4
        with:
          name: pqc-pdf-sign-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: cd core && staticcheck ./...

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: cd core && govulncheck ./...

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
