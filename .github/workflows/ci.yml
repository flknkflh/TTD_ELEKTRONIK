# Pull-request pipeline (Rencana V1 §27).
# format -> unit test Go -> static analysis -> build AAR -> (Android lint: M5)
# -> build server image (M6) -> dependency/secret scan.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: '**/go.sum'

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l core apps server tools 2>/dev/null || true)"
          if [ -n "$fmt_out" ]; then echo "unformatted:"; echo "$fmt_out"; exit 1; fi

      - name: core — vet + test
        working-directory: core
        run: |
          go vet ./...
          go test -race ./...

      - name: windows client — vet + cross-build
        working-directory: apps/windows
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go build ./...
          go build ./...   # stub path builds on linux too

      - name: server — vet + test
        working-directory: server
        run: |
          go vet ./...
          go test ./...

      - name: ca-admin — vet + test
        working-directory: tools/ca-admin
        run: |
          go vet ./...
          go test ./...

  aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: install NDK r27
        run: sdkmanager --install "ndk;27.1.12297006"
      - name: build pqcsign.aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
        run: sh apps/android/build-aar.sh
      - name: check AAR contents
        run: |
          unzip -l apps/android/app/libs/pqcsign.aar | grep 'jni/arm64-v8a/libgojni.so'
          unzip -p apps/android/app/libs/pqcsign.aar classes.jar > /tmp/c.jar
          unzip -l /tmp/c.jar | grep 'mobilebridge/Mobilebridge.class'

      - name: android unit tests + debug APK
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
      # KeyVaultInstrumentedTest (androidTest) needs an emulator — run it on a
      # device or a CI emulator lane; not in this job.
      - name: check APK contents
        run: |
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep 'lib/arm64-v8a/libgojni.so'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pqc-pdf-sign-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  e2e-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - name: full local end-to-end run (CA + receiver + client)
        run: bash tests/e2e/local-run.sh

  server-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - name: api suite against PostgreSQL
        working-directory: server
        env:
          PQC_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
        run: go test ./internal/api/ -count=1
      - name: validate compose
        run: docker compose -f deploy/lab/docker-compose.yml --env-file deploy/lab/.env.lab.example config --quiet

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - name: keystore (DPAPI) + appcore end-to-end
        working-directory: apps/windows
        run: |
          go vet ./...
          go test ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - name: fuzz stdlib-backed parsers (30s each)
        working-directory: core
        run: |
          set -e
          go test ./keys/       -run=x -fuzz='^FuzzParsePKCS8$'            -fuzztime=30s
          go test ./enrollment/ -run=x -fuzz='^FuzzParseAndValidateCSR$'  -fuzztime=30s
          go test ./certutil/   -run=x -fuzz='^FuzzParseCertificatePEM$'  -fuzztime=20s
          go test ./certutil/   -run=x -fuzz='^FuzzParseChainPEM$'        -fuzztime=20s
          go test ./certutil/   -run=x -fuzz='^FuzzValidateCRL$'          -fuzztime=20s
      # NOTE: verification/FuzzVerifyPDF and signing/FuzzSignPDF are NOT
      # actively fuzzed here — see docs/security-findings.md SF-1. Their seed
      # corpus runs in the `go` job's `go test ./...`.

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: cd core && staticcheck ./... && cd ../server && staticcheck ./...

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.0' }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: cd core && govulncheck ./...

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
